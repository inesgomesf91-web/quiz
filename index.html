/* ---------------------------------------------------------
   RESULTADOS
   --------------------------------------------------------- */
const RESULTADOS = {
  ultima: {
    nome: 'A família de sábado de manhã',

const DESEMPATE = ['malabar', 'ultima', 'gratis', 'explora'];

/* ---------------------------------------------------------
   ESTADO
   --------------------------------------------------------- */
const params = new URLSearchParams(location.search);
const respostas = {};
let historico = [];   // índices das perguntas visitadas, para voltar atrás
let ecraAtual = 'inicio';
const app = document.getElementById('app');
const barra = document.getElementById('progresso');

function perguntasVisiveis() { return PERGUNTAS.filter(q => !q.se || q.se(respostas)); }
function totalPassos() { return perguntasVisiveis().length + 1; }

function setProgresso(n) {
  barra.style.width = Math.min(100, Math.round(n / totalPassos() * 100)) + '%';
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------------------------------------------------------
   ECRÃS
   --------------------------------------------------------- */
function mostrarInicio() {
  ecraAtual = 'inicio';
  contarPasso('abriu');
  setProgresso(0);
  app.innerHTML = `
    <section class="ecra ativo">
      <div class="bloco-capa">
        <span class="etiqueta">Quiz · 2 minutos</span>
        <h1>Que família de fim de semana são vocês?</h1>
        <p>São perguntas rápidas sobre os vossos últimos fins de semana e, no fim, digo-te que tipo de família são e o que vos dá mais jeito em Leiria.</p>
      </div>
      <p>Fiz este quiz porque quero conhecer melhor as famílias que me seguem (e as que ainda não me conhecem), para que a agenda vos sirva mesmo. Não há respostas certas.</p>
      <button class="botao terracota" id="comecar">Começar</button>
      <p class="letra-pequena">Feito pela Inês, mãe de dois aqui em Leiria 🏰💛</p>
    </section>`;
  document.getElementById('comecar').onclick = () => { contarPasso('comecou'); historico = []; irPara(0); };
}

function irPara(i) {
  const visiveis = perguntasVisiveis();
  if (i >= visiveis.length) return mostrarContacto();
  const q = visiveis[i];
  ecraAtual = i;
  contarPasso(q.id);
  setProgresso(i + 1);

  let corpo;
  if (q.aberta) {
    corpo = `
      <textarea id="texto" placeholder="Por exemplo: queríamos ir ao teatro mas já não havia bilhetes e acabámos no shopping...">${esc(respostas[q.id] || '')}</textarea>
      <button class="botao" id="seguinte">Seguinte</button>`;
  } else {
    corpo = `<div class="opcoes" role="group" aria-label="${esc(q.titulo)}">` +
      q.opcoes.map(o => {
        const sel = q.multipla ? (respostas[q.id] || []).includes(o.v) : respostas[q.id] === o.v;
        return `<button class="opcao" data-v="${esc(o.v)}" aria-pressed="${sel}">` +
          (q.multipla ? '<span class="marca" aria-hidden="true"></span>' : '') +
          `<span>${esc(o.t)}</span></button>`;
      }).join('') + '</div>' +
      (q.multipla ? `<button class="botao" id="seguinte" ${(respostas[q.id] || []).length ? '' : 'disabled'}>Seguinte</button>` : '');
  }

  app.innerHTML = `
    <section class="ecra ativo">
      <span class="etiqueta">Pergunta ${i + 1} de ${visiveis.length}</span>
      <h2>${esc(q.titulo)}</h2>
      ${q.ajuda ? `<p class="ajuda">${esc(q.ajuda)}</p>` : ''}
      ${corpo}
      <div class="navegacao">
        <button class="ligacao" id="voltar">Voltar</button>
        ${q.aberta ? '<button class="ligacao" id="saltar">Saltar esta</button>' : '<span></span>'}
      </div>
    </section>`;

  const avancar = () => {
    historico.push(i);
    if (q.depois) mostrarCuriosidade(q, i); else irPara(i + 1);
  };

  document.getElementById('voltar').onclick = () => {
    if (historico.length) irPara(historico.pop()); else mostrarInicio();
  };

  if (q.aberta) {
    const t = document.getElementById('texto');
    document.getElementById('seguinte').onclick = () => { respostas[q.id] = t.value.trim(); avancar(); };
    document.getElementById('saltar').onclick = () => { respostas[q.id] = ''; avancar(); };
    return;
  }

  app.querySelectorAll('.opcao').forEach(b => {
    b.onclick = () => {
      const v = b.dataset.v;
      if (q.multipla) {
        const lista = respostas[q.id] || [];
        respostas[q.id] = lista.includes(v) ? lista.filter(x => x !== v) : lista.concat(v);
        b.setAttribute('aria-pressed', respostas[q.id].includes(v));
        document.getElementById('seguinte').disabled = !respostas[q.id].length;
      } else {
        respostas[q.id] = v;
        // se a resposta deixa de abrir a pergunta condicional, limpar o que lá estava
        PERGUNTAS.forEach(p => { if (p.se && !p.se(respostas)) delete respostas[p.id]; });
        app.querySelectorAll('.opcao').forEach(x => x.setAttribute('aria-pressed', x === b));
        setTimeout(avancar, 180);
      }
    };
  });
  if (q.multipla) document.getElementById('seguinte').onclick = avancar;
}

// «Sabias que…» entre perguntas: mantém as pessoas até ao fim
// e testa as descobertas (só factos verificados na fonte).
function mostrarCuriosidade(q, i) {
  ecraAtual = 'curiosidade-' + q.id;
  contarPasso('sabias-' + q.id);
  app.innerHTML = `
    <section class="ecra ativo">
      <div class="resultado-capa">
        <span class="etiqueta">Sabias que…</span>
        <h2 style="color: var(--creme)">${esc(q.depois.titulo)}</h2>
        <p>${esc(q.depois.texto)}</p>
      </div>
      <button class="botao terracota" id="continuar">Continuar</button>
      <div class="navegacao"><button class="ligacao" id="voltar">Voltar</button><span></span></div>
    </section>`;
  document.getElementById('continuar').onclick = () => irPara(i + 1);
  document.getElementById('voltar').onclick = () => irPara(historico.pop());
  window.scrollTo({ top: 0 });
}

function mostrarContacto() {
  ecraAtual = 'contacto';
  contarPasso('contacto');
  setProgresso(totalPassos() - 0.5);
  app.innerHTML = `
    <section class="ecra ativo">
      <span class="etiqueta">Resultado pronto</span>
      <h2>Já sei que família são vocês 🏰</h2>
      <p class="ajuda">Deixa o teu email para veres o resultado e, se quiseres, todas as quintas recebes os planos do fim de semana em Leiria, escolhidos por mim.</p>
      <form id="form" novalidate>
        <label class="campo"><span>O teu nome <small>(opcional)</small></span>
          <input type="text" id="nome" autocomplete="given-name"></label>
        <label class="campo"><span>O teu email</span>
          <input type="email" id="email" autocomplete="email" inputmode="email" required></label>
        <label class="caixa"><input type="checkbox" id="newsletter">
          <span>Quero receber o email de quinta com os planos do fim de semana (saio quando quiser, com um clique).</span></label>
        <label class="caixa"><input type="checkbox" id="ligar">
          <span>Aceito que a Inês me ligue 15 minutos para conhecer melhor os nossos fins de semana.</span></label>
        <label class="campo" id="campo-tel" hidden><span>O teu telemóvel</span>
          <input type="tel" id="telemovel" autocomplete="tel" inputmode="tel"></label>
        <p class="erro" id="erro" role="alert"></p>
        <button class="botao terracota" type="submit" id="ver">Ver o nosso resultado</button>
      </form>
      <div class="navegacao"><button class="ligacao" id="voltar">Voltar</button><span></span></div>
      <p class="letra-pequena">Uso os teus dados só para o Miúdos em Leiria: o email de quinta, se o pediste, e uma chamada, se aceitaste. Não os partilho com ninguém e podes pedir para os apagar em geral@miudosemleiria.pt.</p>
    </section>`;

  const ligar = document.getElementById('ligar');
  ligar.onchange = () => { document.getElementById('campo-tel').hidden = !ligar.checked; };
  document.getElementById('voltar').onclick = () => irPara(historico.pop());

  document.getElementById('form').onsubmit = e => {
    e.preventDefault();
    const erro = document.getElementById('erro');
    const email = document.getElementById('email').value.trim();
    const tel = document.getElementById('telemovel').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { erro.textContent = 'Falta o email (ou há um erro nele).'; return; }
    if (ligar.checked && tel.replace(/\D/g, '').length < 9) { erro.textContent = 'Falta o telemóvel para te ligar.'; return; }
    erro.textContent = '';

    const tipo = calcularResultado();
    enviar({
      nome: document.getElementById('nome').value.trim(),
      email: email,
      newsletter: document.getElementById('newsletter').checked ? 'sim' : 'não',
      ligar: ligar.checked ? 'sim' : 'não',
      telemovel: ligar.checked ? tel : '',
      resultado: RESULTADOS[tipo.vencedor].nome,
      pontos: JSON.stringify(tipo.pontos),
      origem: params.get('o') || '',
      idades: (respostas.idades || []).join(', '),
      concelho: respostas.concelho || '',
      decidir: respostas.decidir || '',
      fizeram: respostas.fizeram || '',
      descobriu: respostas.descobriu || '',
      perdeu: respostas.perdeu || '',
      gasto: respostas.gasto || '',
      pausa: respostas.pausa || '',
      gasto_pausa: respostas.gasto_pausa || '',
      custa: respostas.custa || '',
      correu_bem: respostas.correu_bem || '',
      historia: respostas.historia || ''
    });
    mostrarResultado(tipo.vencedor, document.getElementById('nome').value.trim());
  };
}

function calcularResultado() {
  const pontos = { ultima: 0, gratis: 0, explora: 0, malabar: 0 };
  perguntasVisiveis().forEach(q => {
    if (!q.opcoes || q.multipla) return;
    const o = q.opcoes.find(x => x.v === respostas[q.id]);
    if (o && o.p) Object.entries(o.p).forEach(([k, n]) => { pontos[k] += n; });
  });
  const max = Math.max(...Object.values(pontos));
  const vencedor = DESEMPATE.find(k => pontos[k] === max);
  return { vencedor, pontos };
}

// Conta quantas pessoas chegam a cada passo (cada passo conta uma vez por visita).
// Vai para a folha «Passos»: nada de dados pessoais, só o nome do passo.
const passosContados = new Set();
function contarPasso(passo) {
  if (passosContados.has(passo)) return;
  passosContados.add(passo);
  if (!URL_RESPOSTAS) { console.log('[quiz] passo:', passo); return; }
  fetch(URL_RESPOSTAS, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ tipo: 'passo', passo: passo, origem: params.get('o') || '' })
  }).catch(() => {});
}

function enviar(dados) {
  if (!URL_RESPOSTAS) { console.log('[quiz] modo de teste, nada enviado:', dados); return; }
  fetch(URL_RESPOSTAS, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(dados)
  }).catch(err => console.warn('[quiz] falhou o envio', err));
}

function mostrarResultado(tipo, nome) {
  ecraAtual = 'resultado';
  contarPasso('resultado');
  setProgresso(totalPassos());
  const r = RESULTADOS[tipo];
  const linkQuiz = location.origin + location.pathname;
  const msg = encodeURIComponent('Fiz este quiz do Miúdos em Leiria e saiu-nos «' + r.nome + '». Que família são vocês? ' + linkQuiz);
  app.innerHTML = `
    <section class="ecra ativo">
      <div class="resultado-capa">
        <span class="etiqueta">${nome ? esc(nome) + ', vocês são' : 'Vocês são'}</span>
        <h1>${r.nome}</h1>
        <p>${r.texto}</p>
      </div>
      <h2>O que vos dá mais jeito</h2>
      <ol class="dicas">${r.dicas.map(d => `<li>${d}</li>`).join('')}</ol>
      <a class="botao terracota" href="${URL_AGENDA}" target="_blank" rel="noopener">Abrir a agenda de Leiria</a>
      <p class="assinatura">Obrigada por responderes, porque é com respostas como a tua que decido o que fazer a seguir. 🏰💛</p>
      <p class="partilha"><a href="https://wa.me/?text=${msg}" target="_blank" rel="noopener">Enviar o quiz a outra mãe ou pai por WhatsApp</a></p>
    </section>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

mostrarInicio();
</script>
